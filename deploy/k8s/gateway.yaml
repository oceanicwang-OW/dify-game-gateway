apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-game-ai-gateway-config
data:
  GATEWAY_ADDR: ":9000"
  GATEWAY_ADMIN_ADDR: ":9001"
  DIFY_BASE_URL: "http://dify-api/v1"
  REDIS_ADDR: "redis:6379"
  UPSTREAM_TIMEOUT_SEC: "60"
  RATE_PER_PLAYER: "1r/2s"
  TOKEN_BUDGET_DAILY: "100000"
  MAX_INFLIGHT_UPSTREAM: "200"
  MODERATION_ENABLED: "true"
  GATEWAY_SERVICE_NAME: "game-ai-gateway"
---
apiVersion: v1
kind: Secret
metadata:
  name: dify-game-ai-gateway-secret
type: Opaque
stringData:
  DIFY_APP_KEYS: "default=app-replace-me"
  AUTH_JWT_PUBKEY: |
    -----BEGIN PUBLIC KEY-----
    replace-me
    -----END PUBLIC KEY-----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-game-ai-gateway
  labels:
    app.kubernetes.io/name: dify-game-ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dify-game-ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify-game-ai-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/dify-game-ai-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-gateway
              containerPort: 9000
              protocol: TCP
            - name: admin
              containerPort: 9001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dify-game-ai-gateway-config
            - secretRef:
                name: dify-game-ai-gateway-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dify-game-ai-gateway
  labels:
    app.kubernetes.io/name: dify-game-ai-gateway
spec:
  selector:
    app.kubernetes.io/name: dify-game-ai-gateway
  ports:
    - name: tcp-gateway
      port: 9000
      targetPort: tcp-gateway
      protocol: TCP
    - name: admin
      port: 9001
      targetPort: admin
      protocol: TCP
