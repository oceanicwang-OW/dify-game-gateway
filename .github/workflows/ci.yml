name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Lint
        run: |
          test -z "$(find . -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"
          go vet ./...
